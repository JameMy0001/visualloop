<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Adherence Analytics — Production Dashboard</title>
  <style>
    :root {
      --bg-dark: #070a11;
      --card-bg: rgba(15, 23, 42, 0.6);
      --border-color: rgba(51, 65, 85, 0.5);
      --primary: #14b8a6;
      --primary-glow: rgba(20, 184, 166, 0.3);
      --accent-teal: #2dd4bf;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(20, 184, 166, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.05) 0%, transparent 40%);
      min-height: 100vh;
    }

    .container { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }
    
    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(20, 184, 166, 0.4);
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .brand-logo:hover { transform: scale(1.05); }

    .header-title-group h1 { font-size: 22px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 12px; letter-spacing: -0.02em; }
    
    .status-badge {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; padding: 4px 10px; border-radius: 6px;
      background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); display: inline-flex; align-items: center; gap: 6px;
      cursor: help;
    }

    .btn {
      padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent;
      transition: all 0.2s; display: flex; align-items: center; gap: 8px;
    }
    .btn-primary { background: var(--primary); color: #042f2e; box-shadow: 0 4px 14px var(--primary-glow); }
    .btn-primary:hover { background: var(--accent-teal); transform: translateY(-1px); }

    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; backdrop-filter: blur(12px); }
    
    .card-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .card-metric { font-size: 32px; font-weight: 800; color: #ffffff; margin-top: 12px; }
    
    .chart-container {
      background: rgba(2, 6, 23, 0.5); border: 1px solid var(--border-color); border-radius: 12px;
      height: 200px; display: flex; align-items: flex-end; padding: 24px 16px 12px; gap: 12px;
    }
    .chart-bar { flex: 1; border-radius: 4px 4px 0 0; background: var(--primary); opacity: 0.6; cursor: pointer; transition: opacity 0.2s; }
    .chart-bar:hover { opacity: 1; }

    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th { padding: 12px 24px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
    td { padding: 16px 24px; border-bottom: 1px solid var(--border-color); }
    
    .progress-track { width: 100px; height: 8px; border-radius: 4px; background: #1e293b; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; }
    
    .action-btn { color: var(--accent-teal); cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <div class="brand-logo" onclick="location.reload()">C</div>
        <div class="header-title-group">
          <h1>Clinical Adherence Portal <span class="status-badge">Live Cluster</span></h1>
        </div>
      </div>
      <button class="btn btn-primary" onclick="window.print()">Export Analytics</button>
    </header>

    <div class="metrics-grid">
      <div class="card">
        <div class="card-top">Active Patient Flow</div>
        <div class="card-metric">1,428</div>
      </div>
      <div class="card">
        <div class="card-top">Aggregate Adherence</div>
        <div class="card-metric">86.4%</div>
      </div>
      <div class="card">
        <div class="card-top">High Risk Alerts</div>
        <div class="card-metric" style="color:#fbbf24">38</div>
      </div>
    </div>

    <div class="card">
      <div style="margin-bottom: 16px; font-weight: 700;">Compliance Velocity</div>
      <div class="chart-container">
        <div class="chart-bar" style="height: 60%"></div>
        <div class="chart-bar" style="height: 80%"></div>
        <div class="chart-bar" style="height: 75%"></div>
        <div class="chart-bar" style="height: 90%"></div>
        <div class="chart-bar" style="height: 85%"></div>
      </div>
    </div>

    <div class="card">
      <div style="font-weight: 700;">High Priority Cohort</div>
      <table>
        <thead><tr><th>Patient</th><th>Compliance</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>
          <tr>
            <td>#PT-8942</td>
            <td><div class="progress-track"><div class="progress-fill" style="width: 68%; background: #fbbf24"></div></div></td>
            <td><span style="color:#fbbf24">Attention Required</span></td>
            <td><a class="action-btn">Contact</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
