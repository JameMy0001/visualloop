<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="40%" stop-color="#FFAE19" />
      <stop offset="90%" stop-color="#FF3A00" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="earth-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </radialGradient>
    <radialGradient id="jupiter-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1200" height="800" fill="url(#space-bg)" />

  <!-- Stars Background -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1.5" />
    <circle cx="340" cy="140" r="1" />
    <circle cx="560" cy="70" r="2" />
    <circle cx="820" cy="110" r="1" />
    <circle cx="980" cy="190" r="1.5" />
    <circle cx="1120" cy="60" r="2" />
    <circle cx="150" cy="650" r="1" />
    <circle cx="430" cy="720" r="2" />
    <circle cx="780" cy="680" r="1.5" />
    <circle cx="1050" cy="740" r="1" />
    <circle cx="60" cy="400" r="1.5" />
    <circle cx="1150" cy="420" r="2" />
  </g>

  <!-- Title & Legend -->
  <text x="60" y="60" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="1.5">
    VISUALLOOP DEMO ARTIFACT — SOLAR SYSTEM
  </text>
  <text x="60" y="85" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">
    Revision 1 • Generated by Agent • Ready for interactive feedback
  </text>

  <!-- Orbits -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.7">
    <ellipse cx="600" cy="400" rx="160" ry="90" />
    <ellipse cx="600" cy="400" rx="260" ry="140" />
    <ellipse cx="600" cy="400" rx="380" ry="200" />
    <ellipse cx="600" cy="400" rx="500" ry="260" />
  </g>

  <!-- Center Star: The Sun -->
  <g id="sun" transform="translate(600, 400)">
    <circle r="70" fill="url(#sun-glow)" filter="url(#glow)" />
    <circle r="46" fill="#FFAE19" />
    <text y="5" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SUN</text>
  </g>

  <!-- Planet 1: Mercury -->
  <g id="mercury" transform="translate(480, 340)">
    <circle r="9" fill="#94A3B8" />
    <text y="22" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Mercury</text>
  </g>

  <!-- Planet 2: Venus -->
  <g id="venus" transform="translate(780, 320)">
    <circle r="15" fill="#FBBF24" />
    <text y="28" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Venus</text>
  </g>

  <!-- Planet 3: Earth & Moon -->
  <g id="earth" transform="translate(320, 460)">
    <circle r="22" fill="url(#earth-grad)" />
    <circle cx="30" cy="-12" r="4" fill="#E2E8F0" />
    <text y="36" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Earth</text>
  </g>

  <!-- Planet 4: Mars -->
  <g id="mars" transform="translate(850, 490)">
    <circle r="13" fill="#EF4444" />
    <text y="26" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Mars</text>
  </g>

  <!-- Planet 5: Jupiter -->
  <g id="jupiter" transform="translate(180, 310)">
    <circle r="42" fill="url(#jupiter-grad)" />
    <!-- Jupiter cloud bands -->
    <path d="M -40 -10 Q 0 -5 40 -10" stroke="#92400E" stroke-width="3" fill="none" opacity="0.6" />
    <path d="M -41 12 Q 0 16 41 12" stroke="#78350F" stroke-width="4" fill="none" opacity="0.6" />
    <text y="58" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Jupiter</text>
  </g>

  <!-- Planet 6: Saturn with Rings -->
  <g id="saturn" transform="translate(1020, 400)">
    <!-- Back ring -->
    <ellipse rx="52" ry="12" fill="none" stroke="#D97706" stroke-width="6" opacity="0.7" transform="rotate(-18)" />
    <circle r="28" fill="#FDE68A" />
    <!-- Front ring -->
    <ellipse rx="52" ry="12" fill="none" stroke="#FBBF24" stroke-width="4" opacity="0.9" transform="rotate(-18)" />
    <text y="46" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Saturn</text>
  </g>
</svg>
