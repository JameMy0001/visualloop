<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisualLoop Demo — Animated Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-container">
    <div class="card">
      <div class="card-glow"></div>
      <div class="badge">Revision 1</div>
      <h2>VisualLoop Agent Card</h2>
      <p>Local-first visual feedback loop for autonomous coding agents.</p>
      <div class="metrics">
        <div class="metric">
          <span class="value">0.8</span>
          <span class="label">Mini Opacity</span>
        </div>
        <div class="metric">
          <span class="value">100%</span>
          <span class="label">Local First</span>
        </div>
      </div>
      <button class="action-btn">Expand & Annotate</button>
    </div>
  </div>
</body>
</html>
