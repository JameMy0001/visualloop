[package]
name = "visualloop"
version = "0.1.0"
description = "VisualLoop Desktop Shell"
authors = ["VisualLoop Contributors"]
edition = "2021"

[lib]
name = "visualloop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
