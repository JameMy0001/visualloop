name: VisualLoop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Dependencies
        run: pnpm install

      - name: Build Workspace Packages
        run: pnpm build

      - name: Run Workspace Tests
        run: pnpm test

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Verify Cargo Tauri Build
        run: cd apps/desktop/src-tauri && cargo check

      - name: Run Scripted Golden-Path Smoke Test
        run: pnpm demo:golden-path

      - name: Run Gemini Model Pipeline E2E Test
        run: pnpm test:gemini-e2e

      - name: Verify Core Server CLI Smoke Test
        run: |
          pnpm --filter @visualloop/core-server start &
          SERVER_PID=$!
          sleep 3
          curl -f -s http://127.0.0.1:4178/v1/health || exit 1
          kill $SERVER_PID || true
